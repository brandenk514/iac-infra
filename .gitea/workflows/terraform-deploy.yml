name: terraform-deploy

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.gitea/workflows/terraform-deploy.yml'
  workflow_dispatch:

jobs:
  main:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: terraform/main
    env:
      TF_HTTP_USERNAME: ${{ github.actor }}
      TF_HTTP_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TF_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'EOF'
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config

      - name: Write tfvars
        env:
          TFVARS: ${{ secrets.TF_TFVARS_MAIN }}
        run: printf '%s' "$TFVARS" > terraform.tfvars

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="address=${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/terraform/state/main" \
            -backend-config="lock_address=${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/terraform/state/main/lock" \
            -backend-config="unlock_address=${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/terraform/state/main/lock" \
            -backend-config="lock_method=POST" \
            -backend-config="unlock_method=DELETE"

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false

  tdarr:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: terraform/tdarr
    env:
      TF_HTTP_USERNAME: ${{ github.actor }}
      TF_HTTP_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TF_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'EOF'
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config

      - name: Write tfvars
        env:
          TFVARS: ${{ secrets.TF_TFVARS_TDARR }}
        run: printf '%s' "$TFVARS" > terraform.tfvars

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="address=${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/terraform/state/tdarr" \
            -backend-config="lock_address=${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/terraform/state/tdarr/lock" \
            -backend-config="unlock_address=${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/terraform/state/tdarr/lock" \
            -backend-config="lock_method=POST" \
            -backend-config="unlock_method=DELETE"

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
