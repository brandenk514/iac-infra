---
# SSH hardening.
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"

# System.
timezone: America/Denver

# Tailscale — store authkey via ansible-vault or pass with `-e tailscale_authkey=...`.
# If unset, tailscale is installed but not brought up.
tailscale_authkey: ""
tailscale_up_args: "--ssh"

