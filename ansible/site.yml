---
- name: Apply baseline to all homelab hosts
  hosts: homelab
  become: true
  gather_facts: true
  roles:
    - role: baseline
      tags: [baseline]
  tags: [baseline]

- name: Render Traefik configuration on docker hosts
  hosts: traefik
  become: true
  gather_facts: false
  roles:
    - role: traefik
      tags: [traefik]
  tags: [traefik]

- name: Configure GPU hosts
  hosts: gpu
  become: true
  gather_facts: true
  roles:
    - role: nvidia
      tags: [nvidia, gpu]
  tags: [nvidia, gpu]
