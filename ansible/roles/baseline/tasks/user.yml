---
- name: Create admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    state: present
  when: admin_authorized_keys | length > 0

- name: Passwordless sudo for admin user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ admin_user }}"
    owner: root
    group: root
    mode: "0440"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: /usr/sbin/visudo -cf %s
  when: admin_authorized_keys | length > 0

- name: Install authorized SSH keys for admin user
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ admin_authorized_keys }}"
  when: admin_authorized_keys | length > 0
