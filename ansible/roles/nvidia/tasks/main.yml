---
- name: Assert Ubuntu
  ansible.builtin.assert:
    that: ansible_facts['distribution'] == "Ubuntu"
    fail_msg: "nvidia role only supports Ubuntu; host is {{ ansible_facts['distribution'] }}"

- name: Blacklist nouveau driver
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      blacklist nouveau
      options nouveau modeset=0
  notify: rebuild initramfs

- name: Install NVIDIA kernel modules (prebuilt)
  ansible.builtin.apt:
    name:
      - "{{ nvidia_kernel_modules_package }}"
      - "nvidia-driver-{{ nvidia_driver_branch }}"
    state: present
    update_cache: true
  when: not nvidia_use_dkms

- name: Install NVIDIA kernel modules (DKMS)
  ansible.builtin.apt:
    name:
      - "nvidia-dkms-{{ nvidia_driver_branch }}"
      - "nvidia-driver-{{ nvidia_driver_branch }}"
    state: present
    update_cache: true
  when: nvidia_use_dkms

- name: Download NVIDIA Container Toolkit GPG key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Add NVIDIA Container Toolkit apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc]
      https://nvidia.github.io/libnvidia-container/stable/deb/{{ ansible_facts['architecture'] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }} /
    filename: nvidia-container-toolkit
    state: present
    update_cache: true

- name: Install NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present

- name: Check NVIDIA kernel module is loaded
  ansible.builtin.command: lsmod
  register: nvidia_lsmod
  changed_when: false
  check_mode: false

- name: Generate CDI spec
  ansible.builtin.command:
    cmd: "nvidia-ctk cdi generate --output={{ nvidia_cdi_spec_path }}"
  when: nvidia_lsmod.stdout_lines | select('match', '^nvidia ') | list | length > 0

- name: Fail if NVIDIA kernel module is not loaded
  ansible.builtin.fail:
    msg: |
      NVIDIA driver installed but kernel module is not loaded.
      Reboot {{ inventory_hostname }} and re-run this play to generate the CDI spec.
  when:
    - nvidia_lsmod.stdout_lines | select('match', '^nvidia ') | list | length == 0
    - not ansible_check_mode
