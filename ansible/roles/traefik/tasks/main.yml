---
- name: Ensure Traefik config directory exists
  ansible.builtin.file:
    path: "{{ traefik_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Traefik certs directory exists
  ansible.builtin.file:
    path: "{{ traefik_certs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure acme.json exists with correct permissions
  ansible.builtin.file:
    path: "{{ traefik_certs_dir }}/acme.json"
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Render traefik.yml (static config)
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_conf_dir }}/traefik.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart traefik

- name: Render config.yml (dynamic config)
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ traefik_conf_dir }}/config.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart traefik
