---
- name: Install docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present

- name: Add docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add docker apt repo
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Install docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure docker running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Create pterodactyl directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/pterodactyl
    - /var/lib/pterodactyl
    - /var/lib/pterodactyl/volumes
    - /var/log/pterodactyl
    - "{{ wings_cert_dir }}"

- name: Download wings binary
  ansible.builtin.get_url:
    url: "https://github.com/pterodactyl/wings/releases/latest/download/wings_linux_{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
    dest: /usr/local/bin/wings
    mode: "0755"
    force: false

- name: Generate self-signed TLS cert for wings
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -nodes -newkey rsa:2048
      -keyout {{ wings_cert_dir }}/privkey.pem
      -out {{ wings_cert_dir }}/fullchain.pem
      -days 3650
      -subj "/CN={{ node_domain }}"
    creates: "{{ wings_cert_dir }}/fullchain.pem"

- name: Secure wings cert private key
  ansible.builtin.file:
    path: "{{ wings_cert_dir }}/privkey.pem"
    mode: "0600"

- name: Install wings systemd unit
  ansible.builtin.template:
    src: wings.service.j2
    dest: /etc/systemd/system/wings.service
    mode: "0644"
  notify: reload systemd

- name: Deploy wings node config
  ansible.builtin.copy:
    content: "{{ wings_node_config }}"
    dest: /etc/pterodactyl/config.yml
    mode: "0600"
  when: wings_node_config | length > 0
  notify: restart wings

- name: Enable and start wings
  ansible.builtin.systemd:
    name: wings
    enabled: true
    state: started
    daemon_reload: true
  when: wings_node_config | length > 0
