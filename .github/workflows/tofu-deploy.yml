name: tofu-deploy

# NOTE: each *-apply job uses `environment: production`. Configure that
# environment in repo Settings → Environments with "Required reviewers"
# enabled, otherwise the approval gate is a no-op.

on:
  push:
    branches: [main]
    paths:
      - 'opentofu/**'
      - '.github/workflows/tofu-deploy.yml'
  workflow_dispatch:

jobs:
  trex-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opentofu/trex
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TF_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'EOF'
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
      - name: Write tfvars
        env:
          TFVARS: ${{ secrets.TF_TFVARS_TREX }}
        run: printf '%s' "$TFVARS" > terraform.tfvars
      - name: Tofu init
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.B2_BUCKET }}" \
            -backend-config="key=main/terraform.tfstate" \
            -backend-config="region=${{ secrets.B2_REGION }}" \
            -backend-config="endpoints={ s3 = \"https://s3.${{ secrets.B2_REGION }}.backblazeb2.com\" }" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="use_path_style=true"
      - name: Tofu plan
        run: |
          set -o pipefail
          tofu plan -input=false -no-color | tee /tmp/plan.txt
      - name: Plan summary
        if: always()
        run: |
          {
            echo "## trex plan"
            echo '<details><summary>plan output</summary>'
            echo
            echo '```hcl'
            cat /tmp/plan.txt 2>/dev/null || echo "(no plan output)"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
  
  trex-apply:
    needs: trex-plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: opentofu/trex
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TF_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'EOF'
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
      - name: Write tfvars
        env:
          TFVARS: ${{ secrets.TF_TFVARS_TREX }}
        run: printf '%s' "$TFVARS" > terraform.tfvars
      - name: Tofu init
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.B2_BUCKET }}" \
            -backend-config="key=main/terraform.tfstate" \
            -backend-config="region=${{ secrets.B2_REGION }}" \
            -backend-config="endpoints={ s3 = \"https://s3.${{ secrets.B2_REGION }}.backblazeb2.com\" }" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="use_path_style=true"
      - name: Tofu apply
        run: tofu apply -auto-approve -input=false

  nanosaurus-plan:
