# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# Basic `dependabot.yml` file defining a multi-ecosystem-group
version: 2

multi-ecosystem-groups:
  infrastructure:
    schedule:
      interval: "weekly"

updates:
  # Docker images are declared in OpenTofu `docker_image` resources, not in
  # Dockerfiles/docker-compose, so the docker/docker-compose ecosystems don't
  # apply here. Container image versioning is handled by Renovate (renovate.json).
  - package-ecosystem: "opentofu"
    directory: "/opentofu"
    patterns: ["docker"]
    multi-ecosystem-group: "infrastructure"
